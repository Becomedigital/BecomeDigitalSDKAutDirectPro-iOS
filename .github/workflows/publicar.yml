name: Publicar RC o versión final

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Versión exacta ya preparada y revisada
        required: true
        type: string
      candidate_branch:
        description: Rama con la versión candidata preparada, con base en main
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publicar-distribucion
  cancel-in-progress: false

jobs:
  resolver:
    name: Seleccionar el commit de entrega
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.target.outputs.commit }}
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fijar el commit que se validará y publicará
        id: target
        run: python3 .github/scripts/release_candidate.py select

  validar:
    needs: resolver
    uses: ./.github/workflows/validar.yml
    with:
      commit: ${{ needs.resolver.outputs.commit }}

  preflight:
    name: Verificar versión, promoción y aprobación requerida
    needs: [resolver, validar]
    runs-on: ${{ endsWith(github.event.repository.name, '-iOS') && (vars.IOS_CI_RUNNER || 'xcode-27') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
      CANDIDATE_COMMIT: ${{ needs.resolver.outputs.commit }}
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Seleccionar Xcode cuando corresponda
        if: endsWith(github.event.repository.name, '-iOS')
        run: |
          if [ -z "$DEVELOPER_DIR" ]; then
            unset DEVELOPER_DIR
            echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          fi
      - name: Validar el commit, los binarios y la RC de origen
        id: version
        run: |
          if [ -n "$CANDIDATE_BRANCH" ]; then
            python3 .github/scripts/release_candidate.py preflight
          else
            python3 .github/scripts/distribution.py preflight
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  publicar:
    name: Publicación aprobada
    needs: [resolver, preflight]
    runs-on: ${{ endsWith(github.event.repository.name, '-iOS') && (vars.IOS_CI_RUNNER || 'xcode-27') || 'ubuntu-24.04' }}
    timeout-minutes: 50
    environment: ${{ endsWith(github.event.repository.name, '-Android') && 'maven-central' || 'sdk-release' }}
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
      CANDIDATE_COMMIT: ${{ needs.resolver.outputs.commit }}
      MAVEN_LICENSE_URL: ${{ vars.MAVEN_LICENSE_URL }}
      MAVEN_LICENSE_NAME: ${{ vars.MAVEN_LICENSE_NAME }}
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Seleccionar Xcode cuando corresponda
        if: endsWith(github.event.repository.name, '-iOS')
        run: |
          if [ -z "$DEVELOPER_DIR" ]; then
            unset DEVELOPER_DIR
            echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          fi
      - name: Volver a verificar antes de acceder a las credenciales externas
        run: |
          if [ -n "$CANDIDATE_BRANCH" ]; then
            python3 .github/scripts/release_candidate.py preflight
          else
            python3 .github/scripts/distribution.py preflight
          fi
      - name: Empaquetar exactamente los binarios aprobados
        run: python3 .github/scripts/distribution.py assemble
      - name: Firmar, validar y publicar en Maven Central
        if: endsWith(github.event.repository.name, '-Android')
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_FINGERPRINT: ${{ vars.SIGNING_FINGERPRINT }}
        run: python3 .github/scripts/distribution.py publish-central
      - name: Publicar los archivos y las notas revisadas en GitHub
        run: python3 .github/scripts/distribution.py publish-github
      - name: Conservar el identificador de Sonatype para recuperar un reintento
        if: always() && endsWith(github.event.repository.name, '-Android')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: despliegue-central-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/become-release/central-deployment.json
          if-no-files-found: ignore
          retention-days: 30
